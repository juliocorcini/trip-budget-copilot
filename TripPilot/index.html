<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- D-BUG-02: maximum-scale=1 + user-scalable=no stops iOS Safari from
         auto-zooming on input focus (and getting stuck). The app is a fixed-zoom
         mobile UI; image zoom is handled inside the photo viewer component. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0F1419" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TripPilot" />
    <title>TripPilot</title>
    <!-- DEC-445 (G5): global static Open Graph fallback. The markers let the
         Pages Function swap this whole block for per-share tags on /g|/t|/s
         routes; every other page keeps the branded default card. -->
    <!-- og:begin -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TripPilot" />
    <meta property="og:title" content="TripPilot" />
    <meta property="og:description" content="Planeje o orçamento da viagem, registre gastos e divida contas — tudo no seu bolso." />
    <meta property="og:image" content="https://trippilot.pages.dev/og/default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TripPilot" />
    <meta name="twitter:description" content="Planeje o orçamento da viagem, registre gastos e divida contas — tudo no seu bolso." />
    <meta name="twitter:image" content="https://trippilot.pages.dev/og/default.png" />
    <!-- og:end -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
